# Render Infrastructure as Code
# https://render.com/docs/yaml
#
# Deploys:
#   - Web Service (FastAPI API)     — handles /api requests
#   - Background Worker (Celery)    — processes async jobs (video generation etc.)
#
# RUNTIME: native Python (NO Docker). Render's Blueprint YAML does NOT support
# the `build:`/`dockerfilePath:`/`context:` block for web/worker services — that
# caused the earlier "field build not found in file.service" error. The Dockerfile
# is optional for local/docker-compose use only.
#
# System packages (ffmpeg, Manim LaTeX, cairo, playwright) are installed by the
# `backend/render_build.sh` script during the build step (Render build+run share
# one container). `rootDir: backend` puts main.py/init.sh/requirements.txt at the
# service root.
#
# DATABASES: Supabase (Postgres) + Upstash (Redis) — external providers.
#   Connection strings are injected as secrets (see "Required secrets" below).
#
# Required secrets (add via Render dashboard → Environment → Secrets):
#   QWEN_API_KEY              — Alibaba/Qwen API key for LLM completion
#   WAN_API_KEY               — Wan API key for video generation (optional, fallback)
#   SUPABASE_DATABASE_URL     — full Postgres URL from Supabase
#   SUPABASE_HOST, SUPABASE_PORT, SUPABASE_DB, SUPABASE_USER, SUPABASE_PASSWORD
#   UPSTASH_REDIS_URL         — Upstash REST/connection URL, e.g. rediss://...
#   B2_KEY_ID, B2_APPLICATION_KEY — Backblaze B2 (optional, for media upload)
#
# NOTE: Whitelist Render's outbound IPs in Supabase + Upstash (they are external).
services:
  # ── API Web Service ────────────────────────────────────────────────
  - type: web
    name: quantifaya-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: bash render_build.sh
    startCommand: bash init.sh web
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MEMGRAPH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromSecret: SUPABASE_DATABASE_URL
      - key: POSTGRES_HOST
        fromSecret: SUPABASE_HOST
      - key: POSTGRES_PORT
        fromSecret: SUPABASE_PORT
      - key: POSTGRES_DB
        fromSecret: SUPABASE_DB
      - key: POSTGRES_USER
        fromSecret: SUPABASE_USER
      - key: POSTGRES_PASSWORD
        fromSecret: SUPABASE_PASSWORD
      - key: REDIS_URL
        fromSecret: UPSTASH_REDIS_URL
      - key: QWEN_API_KEY
        fromSecret: QWEN_API_KEY
      - key: WAN_API_KEY
        fromSecret: WAN_API_KEY
      - key: VIDEO_GEN_PROVIDER
        value: "wan"
      - key: VIDEO_GEN_FALLBACK_PROVIDER
        value: "wan"
      - key: BROLL_STRATEGY
        value: "off"
      - key: B2_BUCKET_NAME
        value: quantifaya-uploads
      - key: B2_APPLICATION_KEY
        fromSecret: B2_APPLICATION_KEY
      - key: B2_KEY_ID
        fromSecret: B2_KEY_ID

  # ── Celery Background Worker ────────────────────────────────────────
  - type: worker
    name: quantifaya-worker
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: bash render_build.sh
    startCommand: bash init.sh worker
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MEMGRAPH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromSecret: SUPABASE_DATABASE_URL
      - key: POSTGRES_HOST
        fromSecret: SUPABASE_HOST
      - key: POSTGRES_PORT
        fromSecret: SUPABASE_PORT
      - key: POSTGRES_DB
        fromSecret: SUPABASE_DB
      - key: POSTGRES_USER
        fromSecret: SUPABASE_USER
      - key: POSTGRES_PASSWORD
        fromSecret: SUPABASE_PASSWORD
      - key: REDIS_URL
        fromSecret: UPSTASH_REDIS_URL
      - key: QWEN_API_KEY
        fromSecret: QWEN_API_KEY
      - key: WAN_API_KEY
        fromSecret: WAN_API_KEY
      - key: VIDEO_GEN_PROVIDER
        value: "wan"
      - key: VIDEO_GEN_FALLBACK_PROVIDER
        value: "wan"
      - key: BROLL_STRATEGY
        value: "off"