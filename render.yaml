# Render Infrastructure as Code
# https://render.com/docs/yaml
#
# Deploys:
#   - Web Service (FastAPI API)  — handles /api requests
#   - Background Worker (Celery) — processes async jobs (video generation etc.)
#
# DATABASES: Supabase (Postgres) + Upstash (Redis) — external providers.
#   No Render-managed Postgres/Redis blocks. Connection strings are injected
#   as secrets (see "Required secrets" below).
#
# Build: both services use backend/Dockerfile via Docker runtime. Do NOT set
# a native `runtime` alongside `dockerfilePath` — they are mutually exclusive
# on Render. Omit `runtime` so Render infers the Docker runtime.
#
# Required secrets (add via Render dashboard → Environment → Secrets):
#   QWEN_API_KEY              — Alibaba/Qwen API key for LLM completion
#   WAN_API_KEY               — Wan API key for video generation (optional, fallback)
#   SUPABASE_DATABASE_URL     — full Postgres URL from Supabase, e.g.
#                               postgresql://postgres:pass@host:5432/postgres
#   SUPABASE_HOST             — Supabase project DB host (from Project Settings → Database)
#   SUPABASE_PORT             — usually 5432 (via direct connection) or 6543 (pooler)
#   SUPABASE_DB               — database name, usually "postgres"
#   SUPABASE_USER             — usually "postgres"
#   SUPABASE_PASSWORD         — your DB password
#   UPSTASH_REDIS_URL         — Upstash REST/connection URL, e.g. rediss://...
#   B2_KEY_ID                 — Backblaze B2 key ID (optional, for media upload)
#   B2_APPLICATION_KEY        — Backblaze B2 application key (optional)
#
# NOTE: For external DBs/Redis you must also add these services to Render's
# "Allow Inbound" rules (Render → your service → Access → Inbound IPs) or
# whitelist them in Supabase/Upstash, since managed Render services are no
# longer hosting the DB/Redis. Render documents the external-services approach.
services:
  # ── API Web Service ────────────────────────────────────────────────
  - type: web
    name: quantifaya-api
    region: oregon
    plan: starter
    build:
      dockerfilePath: Dockerfile
      context: ./backend
    startCommand: bash init.sh web
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MEMGRAPH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromSecret: SUPABASE_DATABASE_URL
      - key: POSTGRES_HOST
        fromSecret: SUPABASE_HOST
      - key: POSTGRES_PORT
        fromSecret: SUPABASE_PORT
      - key: POSTGRES_DB
        fromSecret: SUPABASE_DB
      - key: POSTGRES_USER
        fromSecret: SUPABASE_USER
      - key: POSTGRES_PASSWORD
        fromSecret: SUPABASE_PASSWORD
      - key: REDIS_URL
        fromSecret: UPSTASH_REDIS_URL
      - key: QWEN_API_KEY
        fromSecret: QWEN_API_KEY
      - key: WAN_API_KEY
        fromSecret: WAN_API_KEY
      - key: VIDEO_GEN_PROVIDER
        value: "wan"
      - key: VIDEO_GEN_FALLBACK_PROVIDER
        value: "wan"
      - key: BROLL_STRATEGY
        value: "off"
      - key: B2_BUCKET_NAME
        value: quantifaya-uploads
      - key: B2_APPLICATION_KEY
        fromSecret: B2_APPLICATION_KEY
      - key: B2_KEY_ID
        fromSecret: B2_KEY_ID

  # ── Celery Background Worker ────────────────────────────────────────
  - type: worker
    name: quantifaya-worker
    region: oregon
    plan: starter
    build:
      dockerfilePath: Dockerfile
      context: ./backend
    startCommand: bash init.sh worker
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MEMGRAPH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromSecret: SUPABASE_DATABASE_URL
      - key: POSTGRES_HOST
        fromSecret: SUPABASE_HOST
      - key: POSTGRES_PORT
        fromSecret: SUPABASE_PORT
      - key: POSTGRES_DB
        fromSecret: SUPABASE_DB
      - key: POSTGRES_USER
        fromSecret: SUPABASE_USER
      - key: POSTGRES_PASSWORD
        fromSecret: SUPABASE_PASSWORD
      - key: REDIS_URL
        fromSecret: UPSTASH_REDIS_URL
      - key: QWEN_API_KEY
        fromSecret: QWEN_API_KEY
      - key: WAN_API_KEY
        fromSecret: WAN_API_KEY
      - key: VIDEO_GEN_PROVIDER
        value: "wan"
      - key: VIDEO_GEN_FALLBACK_PROVIDER
        value: "wan"
      - key: BROLL_STRATEGY
        value: "off"
